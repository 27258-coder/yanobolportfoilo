    <main>
        <h1>ติดต่อสอบถาม (Contact Us)</h1>
        
        <section>
            <h2>ข้อมูลการติดต่อ</h2>
            <p><strong>อีเมล:</strong>27322@tnw.ac.th</p>
            <p><strong>โซเชียลมีเดีย:</strong></p>
            <ul>
                <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
                <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
            </ul>
        </section>

        <hr>

        <section>
            <h2>แบบฟอร์มฝากข้อความ</h2>
            <form action="#" method="get">
                <div>
                    <label for="fullname">ชื่อ-นามสกุล:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="นางสาวญาโณบล ปลัดวิเศษ" required>
                </div>
                <br>
                <div>
                    <label for="email">อีเมล:</label><br>
                    <input type="email" id="email" name="email" placeholder="27322@tnw.ac.th" required>
                </div>
                <br>
                <div>
                    <label for="message">ข้อความ:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="พิมพ์ข้อความที่ต้องการฝากไว้ที่นี่..." required></textarea>
                </div>
                <br>
                <div>
                    <button type="submit">ยืนยันการส่งข้อความ</button>
                </div>
            </form>
        </section>
    </main>
